<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>xCLR8</title>
<style>
  :root {
    --navy: #16283f;
    --navy-light: #1f3a5c;
    --blue: #2563a8;
    --blue-light: #eaf2fb;
    --border: #e3e7ed;
    --bg: #f4f6f9;
    --text: #1a2433;
    --muted: #6b7686;
    --green: #1c7a34;
    --green-bg: #e3f5e7;
    --amber: #93630a;
    --amber-bg: #fdf1dc;
    --red: #b3261e;
    --red-bg: #fbe9e8;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--navy);
    color: #cdd9e6;
    min-height: 100vh;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
  }
  .sidebar .brand { padding: 0 20px 20px; }
  .sidebar .brand h1 { color: white; font-size: 19px; margin: 0; letter-spacing: 0.3px; }
  .sidebar .brand p { margin: 4px 0 0; font-size: 12px; color: #8ea3bb; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .sidebar nav a {
    padding: 10px 20px;
    color: #cdd9e6;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .sidebar nav a:hover { background: var(--navy-light); color: white; }
  .sidebar nav a.active { background: var(--navy-light); color: white; border-left-color: #5ea1f2; font-weight: 600; }
  .sidebar .whoami {
    margin-top: auto;
    padding: 14px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
    color: #8ea3bb;
  }
  .sidebar .whoami b { color: #dce6f0; }
  .sidebar .whoami a { color: #5ea1f2; cursor: pointer; text-decoration: none; }

  /* ---------- Main content ---------- */
  .content { flex: 1; min-width: 0; padding: 28px 36px; }
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .crumbs a { color: var(--blue); cursor: pointer; text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }

  .panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(20, 30, 45, 0.03);
  }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .panel h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .panel .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--blue-light); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 650; letter-spacing: 0.02em; }
  .badge.reporting { background: var(--green-bg); color: var(--green); }
  .badge.draft { background: #eef0f3; color: var(--muted); }
  .badge.locked { background: var(--amber-bg); color: var(--amber); }
  .badge.unlocked { background: #eef0f3; color: var(--muted); }
  .badge.group { background: var(--blue-light); color: var(--blue); }
  .badge.individual { background: #eef0f3; color: var(--muted); }

  form.inline { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: end; padding-top: 14px; border-top: 1px dashed var(--border); }
  form.inline label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; font-weight: 500; }
  input, select {
    padding: 8px 10px; border: 1px solid #cfd6e0; border-radius: 6px; font-size: 13.5px; min-width: 100px;
    font-family: inherit; background: white; color: var(--text);
  }
  input:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-light); }
  button {
    padding: 8px 16px; border: none; background: var(--blue); color: white; border-radius: 6px;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1d5088; }
  button.secondary { background: #eef0f3; color: var(--text); }
  button.secondary:hover { background: #e2e5ea; }
  button.danger { background: var(--red-bg); color: var(--red); }
  button.danger:hover { background: #f6d9d7; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty { color: var(--muted); font-size: 13.5px; padding: 10px 0; }
  .error { background: var(--red-bg); color: var(--red); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .row-actions { display: flex; gap: 8px; align-items: center; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tabs button.tab {
    background: none; color: var(--muted); font-weight: 600; padding: 10px 16px; border-radius: 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button.tab:hover { background: none; color: var(--text); }
  .tabs button.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  .quote-sheet { border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; background: #fbfcfe; }
  .quote-sheet h3 { margin: 0 0 4px; }
  .quote-sheet .total { text-align: right; font-size: 15px; font-weight: 700; margin-top: 10px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13.5px; margin-bottom: 12px; }
  .kv b { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }

  .panel.subtle { background: #fbfcfe; box-shadow: none; }
  .dialog { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 10px; max-width: 360px; }
  .dialog-title { font-size: 13px; font-weight: 650; color: var(--text); }
  .dialog label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; font-weight: 500; }
  .dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">
    <h1>xCLR8</h1>
    <p>Quoting engine — Phase 2</p>
  </div>
  <nav id="nav"></nav>
  <div class="whoami" id="whoami"></div>
</div>
<div class="content" id="app"></div>

<script>
// ---------- Identity (stand-in until real login exists) ----------
function getUserName() {
  let name = localStorage.getItem('xclr8_username');
  if (!name) {
    name = prompt('Your name (used for quote locking):', 'Michael') || 'Michael';
    localStorage.setItem('xclr8_username', name);
  }
  return name;
}
function renderWhoAmI() {
  const el = document.getElementById('whoami');
  el.innerHTML = '';
  el.appendChild(document.createTextNode('Working as '));
  el.appendChild(el2('b', {}, getUserName()));
  el.appendChild(document.createTextNode(' · '));
  const change = el2('a', {}, 'change');
  change.onclick = () => { localStorage.removeItem('xclr8_username'); getUserName(); renderWhoAmI(); };
  el.appendChild(change);
}

const app = document.getElementById('app');
let state = { view: 'jobs' };

async function api(path, opts) {
  const res = await fetch(path, {
    method: opts?.method || 'GET',
    headers: opts?.body ? { 'Content-Type': 'application/json' } : undefined,
    body: opts?.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    let msg;
    try { msg = (await res.json()).message; } catch { msg = await res.text(); }
    throw new Error(Array.isArray(msg) ? msg.join(', ') : (msg || `${res.status}`));
  }
  return res.status === 204 ? null : res.json();
}

function el2(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    // Skip undefined/null/false so a conditional attr (e.g.
    // `selected: cond ? 'true' : undefined`) is actually omitted rather
    // than being set to the literal string "undefined" — which, on a
    // boolean attribute like `selected` or `checked`, still counts as
    // present and silently overrides the real one (2026-09-19 fix).
    if (v === undefined || v === null || v === false) continue;
    if (k === 'onclick') node.onclick = v;
    else if (k === 'html') node.innerHTML = v;
    else if (v === true) node.setAttribute(k, '');
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return node;
}
const el = el2;

function crumbs(parts) {
  const wrap = el('div', { class: 'crumbs' });
  parts.forEach((p, i) => {
    if (i > 0) wrap.appendChild(document.createTextNode(' / '));
    wrap.appendChild(p.onClick ? el('a', { onclick: p.onClick }, p.label) : document.createTextNode(p.label));
  });
  return wrap;
}
function goto(view, extra) { state = { view, ...extra }; render(); }

// ---------- Nav ----------
const NAV_ITEMS = [
  { key: 'jobs', label: 'Jobs', view: 'jobs' },
  { key: 'customers', label: 'Customers', view: 'customers' },
  { key: 'manufacturers', label: 'Manufacturers', view: 'manufacturers' },
];
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const topLevel = ['jobs', 'job', 'quote', 'version', 'lineItem'].includes(state.view) ? 'jobs'
    : ['customers'].includes(state.view) ? 'customers'
    : ['manufacturers'].includes(state.view) ? 'manufacturers' : '';
  NAV_ITEMS.forEach(item => {
    const a = el('a', { onclick: () => goto(item.view) }, item.label);
    if (item.key === topLevel) a.classList.add('active');
    nav.appendChild(a);
  });
}

async function render() {
  renderNav();
  renderWhoAmI();
  app.innerHTML = '';
  try {
    if (state.view === 'jobs') await renderJobs();
    else if (state.view === 'job') await renderJob();
    else if (state.view === 'quote') await renderQuote();
    else if (state.view === 'version') await renderVersion();
    else if (state.view === 'lineItem') await renderLineItem();
    else if (state.view === 'customers') await renderCustomers();
    else if (state.view === 'customer') await renderCustomerDetail();
    else if (state.view === 'manufacturers') await renderManufacturersPage();
  } catch (e) {
    app.appendChild(el('div', { class: 'panel' }, el('div', { class: 'error' }, String(e.message || e))));
  }
}

// ================= JOBS =================
function timeAgo(dateStr) {
  const diffMs = Date.now() - new Date(dateStr).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.round(hours / 24);
  return `${days}d ago`;
}

async function renderJobs() {
  app.appendChild(crumbs([{ label: 'Jobs' }]));

  const recent = await api('/recent-jobs');
  if (recent.length) {
    const recentPanel = el('div', { class: 'panel' });
    recentPanel.appendChild(el('div', { class: 'panel-header' }, el('h2', {}, 'Recent Quotes')));
    const rtable = el('table');
    rtable.appendChild(el('tr', {}, [
      el('th', {}, 'Job'), el('th', {}, 'Last Worked On'),
      el('th', {}, 'Status'), el('th', {}, 'Last Modified'), el('th', {}, 'Last Edited By'),
    ]));
    // One row per job (most-recently-touched version, for context) — click
    // goes to that job's versions page, not straight into the one version
    // (confirmed 2026-09-19).
    recent.forEach(r => {
      const row = el('tr', { class: 'clickable' }, [
        el('td', {}, r.jobName),
        el('td', {}, `${r.bidPackage} — v${r.versionNumber}${r.label ? ' — ' + r.label : ''}`),
        el('td', {}, [
          r.isReporting ? el('span', { class: 'badge reporting' }, 'Reporting') : el('span', { class: 'badge draft' }, 'Draft'),
          ' ',
          r.lockHolderName ? el('span', { class: 'badge locked' }, `🔒 ${r.lockHolderName}`) : null,
        ]),
        el('td', {}, timeAgo(r.updatedAt)),
        el('td', {}, r.lastEditedBy || '—'),
      ]);
      row.onclick = () => goto('job', { jobId: r.jobId });
      rtable.appendChild(row);
    });
    recentPanel.appendChild(rtable);
    app.appendChild(recentPanel);
  }

  const jobs = await api('/jobs');
  const panel = el('div', { class: 'panel' });
  panel.appendChild(el('div', { class: 'panel-header' }, el('h2', {}, `Jobs (${jobs.length})`)));
  if (!jobs.length) panel.appendChild(el('div', { class: 'empty' }, 'No jobs yet — add one below.'));
  else {
    const table = el('table');
    table.appendChild(el('tr', {}, [el('th', {}, 'Name'), el('th', {}, 'Address'), el('th', {}, 'Account')]));
    jobs.forEach(j => table.appendChild(el('tr', { class: 'clickable', onclick: () => goto('job', { jobId: j.id }) }, [
      el('td', {}, j.name), el('td', {}, j.address || '—'), el('td', {}, j.accountName || '—'),
    ])));
    panel.appendChild(table);
  }
  const form = el('form', { class: 'inline' });
  form.append(
    el('label', {}, ['Job name', el('input', { name: 'name', required: 'true' })]),
    el('label', {}, ['Address', el('input', { name: 'address' })]),
    el('label', {}, ['Account', el('input', { name: 'accountName' })]),
    el('button', {}, 'Add job'),
  );
  form.onsubmit = async (e) => {
    e.preventDefault();
    await api('/jobs', { method: 'POST', body: Object.fromEntries(new FormData(form).entries()) });
    render();
  };
  panel.appendChild(form);
  app.appendChild(panel);
}

async function renderJob() {
  const job = await api(`/jobs/${state.jobId}`);
  app.appendChild(crumbs([
    { label: 'Jobs', onClick: () => goto('jobs') },
    { label: job.name },
  ]));

  const quotes = await api(`/jobs/${job.id}/quotes`);
  const quotesWithVersions = await Promise.all(quotes.map(q => api(`/quotes/${q.id}`)));

  quotesWithVersions.forEach(quote => {
    const panel = el('div', { class: 'panel' });
    // Only show the bid package name as a heading once there's more than
    // one (an addendum, say) — the common single-bid-package job just
    // shows its versions directly, no extra label to read past.
    const heading = quotesWithVersions.length > 1 ? `${job.name} — ${quote.bidPackage}` : job.name;
    panel.appendChild(el('div', { class: 'panel-header' }, el('h2', {}, heading)));
    const table = el('table');
    table.appendChild(el('tr', {}, [el('th', {}, 'Version'), el('th', {}, 'Label'), el('th', {}, 'Status'), el('th', {}, 'Lock'), el('th', {}, 'Created')]));
    quote.versions.forEach(v => {
      const locked = !!v.lockHolderName;
      const row = el('tr', { class: 'clickable' }, [
        el('td', {}, `v${v.versionNumber}`),
        el('td', {}, v.label || '—'),
        el('td', {}, v.isReporting ? el('span', { class: 'badge reporting' }, 'Reporting') : el('span', { class: 'badge draft' }, 'Draft')),
        el('td', {}, locked ? el('span', { class: 'badge locked' }, `🔒 ${v.lockHolderName}`) : el('span', { class: 'badge unlocked' }, 'Open')),
        el('td', {}, new Date(v.createdAt).toLocaleString()),
      ]);
      row.onclick = () => goto('version', { versionId: v.id, quoteId: quote.id });
      table.appendChild(row);
    });
    panel.appendChild(table);
    panel.appendChild(newVersionControl(quote.id));
    app.appendChild(panel);
  });

  // Tucked-away secondary action — most jobs only ever need the one
  // ("Base Bid") bid package that's created automatically with the job.
  const addBidPackage = el('details', { class: 'panel subtle' });
  addBidPackage.appendChild(el('summary', {}, 'Add another bid package (e.g. an addendum)'));
  const form = el('form', { class: 'inline' });
  form.append(
    el('label', {}, ['Bid package', el('input', { name: 'bidPackage', placeholder: 'Addendum 1' })]),
    el('button', {}, 'Add bid package'),
  );
  form.onsubmit = async (e) => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(form).entries());
    if (!body.bidPackage) delete body.bidPackage;
    await api(`/jobs/${job.id}/quotes`, { method: 'POST', body });
    render();
  };
  addBidPackage.appendChild(form);
  app.appendChild(addBidPackage);
}

// ================= QUOTES / VERSIONS =================
async function renderQuote() {
  const quote = await api(`/quotes/${state.quoteId}`);
  const job = await api(`/jobs/${quote.jobId}`);
  app.appendChild(crumbs([
    { label: 'Jobs', onClick: () => goto('jobs') },
    { label: job.name, onClick: () => goto('job', { jobId: job.id }) },
    { label: quote.bidPackage },
  ]));
  const panel = el('div', { class: 'panel' });
  panel.appendChild(el('div', { class: 'panel-header' }, el('h2', {}, `Versions — ${quote.bidPackage}`)));
  const table = el('table');
  table.appendChild(el('tr', {}, [el('th', {}, 'Version'), el('th', {}, 'Label'), el('th', {}, 'Status'), el('th', {}, 'Lock'), el('th', {}, 'Created')]));
  quote.versions.forEach(v => {
    const locked = !!v.lockHolderName;
    const row = el('tr', { class: 'clickable' }, [
      el('td', {}, `v${v.versionNumber}`),
      el('td', {}, v.label || '—'),
      el('td', {}, v.isReporting ? el('span', { class: 'badge reporting' }, 'Reporting') : el('span', { class: 'badge draft' }, 'Draft')),
      el('td', {}, locked ? el('span', { class: 'badge locked' }, `🔒 ${v.lockHolderName}`) : el('span', { class: 'badge unlocked' }, 'Open')),
      el('td', {}, new Date(v.createdAt).toLocaleString()),
    ]);
    row.onclick = () => goto('version', { versionId: v.id, quoteId: quote.id });
    table.appendChild(row);
  });
  panel.appendChild(table);
  panel.appendChild(newVersionControl(quote.id));
  app.appendChild(panel);
}

/**
 * "Create new version" always asks first whether to copy the current
 * version's line items/pricing or start completely blank (confirmed
 * 2026-09-19) — no more silent copy-by-default. Implemented as a small
 * inline dialog rather than a native modal, since everything else in this
 * app is inline panels.
 */
function newVersionControl(quoteId) {
  const wrap = el('div', { class: 'panel subtle' });
  const openBtn = el('button', {}, '+ New version');
  wrap.appendChild(openBtn);

  const dialog = el('div', { class: 'dialog', style: 'display:none;' });
  const labelInput = el('input', { name: 'label', placeholder: 'Revised drawings 9/19' });
  dialog.append(
    el('div', { class: 'dialog-title' }, 'Start the new version from…'),
    el('label', {}, ['Label (optional)', labelInput]),
    el('div', { class: 'dialog-actions' }, [
      (() => {
        const b = el('button', {}, 'Copy current version');
        b.onclick = () => submit(false);
        return b;
      })(),
      (() => {
        const b = el('button', { class: 'secondary' }, 'Start blank version');
        b.onclick = () => submit(true);
        return b;
      })(),
      (() => {
        const b = el('button', { class: 'secondary' }, 'Cancel');
        b.type = 'button';
        b.onclick = () => { dialog.style.display = 'none'; openBtn.style.display = ''; };
        return b;
      })(),
    ]),
  );
  wrap.appendChild(dialog);

  openBtn.onclick = () => { openBtn.style.display = 'none'; dialog.style.display = ''; };

  async function submit(blank) {
    const body = { blank };
    if (labelInput.value) body.label = labelInput.value;
    await api(`/quotes/${quoteId}/versions`, { method: 'POST', body });
    render();
  }

  return wrap;
}

async function renderVersion() {
  const quote = await api(`/quotes/${state.quoteId}`);
  const version = quote.versions.find(v => v.id === state.versionId);
  const job = await api(`/jobs/${quote.jobId}`);
  const tab = state.tab || 'lineItems';

  app.appendChild(crumbs([
    { label: 'Jobs', onClick: () => goto('jobs') },
    { label: job.name, onClick: () => goto('job', { jobId: job.id }) },
    { label: quote.bidPackage, onClick: () => goto('quote', { quoteId: quote.id }) },
    { label: `v${version.versionNumber}` },
  ]));

  // --- Lock status panel ---
  const lockPanel = el('div', { class: 'panel' });
  const locked = !!version.lockHolderName;
  const me = getUserName();
  const statusLine = el('div', { class: 'panel-header' }, [
    el('div', {}, [
      el('h2', {}, `v${version.versionNumber}${version.label ? ' — ' + version.label : ''} `),
      el('span', { class: `badge ${version.isReporting ? 'reporting' : 'draft'}` }, version.isReporting ? 'Reporting' : 'Draft'),
      ' ',
      el('span', { class: `badge ${locked ? 'locked' : 'unlocked'}` }, locked ? `🔒 Locked by ${version.lockHolderName}` : 'Unlocked'),
    ]),
  ]);
  lockPanel.appendChild(statusLine);
  const actions = el('div', { class: 'row-actions' });
  if (!locked) {
    const lockBtn = el('button', {}, `Lock as ${me}`);
    lockBtn.onclick = async () => { await api(`/versions/${version.id}/lock`, { method: 'POST', body: { userName: me } }); render(); };
    actions.appendChild(lockBtn);
  } else if (version.lockHolderName === me) {
    const unlockBtn = el('button', { class: 'secondary' }, 'Release my lock');
    unlockBtn.onclick = async () => { await api(`/versions/${version.id}/unlock`, { method: 'POST', body: { userName: me } }); render(); };
    actions.appendChild(unlockBtn);
  } else {
    const forceBtn = el('button', { class: 'danger' }, `Force-unlock (held by ${version.lockHolderName})`);
    forceBtn.onclick = async () => { await api(`/versions/${version.id}/force-unlock`, { method: 'POST', body: { userName: me } }); render(); };
    actions.appendChild(forceBtn);
  }
  if (!version.isReporting) {
    const reportBtn = el('button', { class: 'secondary' }, 'Use for Salesforce reporting');
    reportBtn.onclick = async () => { await api(`/quotes/${quote.id}/versions/${version.id}/set-reporting`, { method: 'POST' }); render(); };
    actions.appendChild(reportBtn);
  }
  lockPanel.appendChild(actions);
  app.appendChild(lockPanel);

  // --- Tabs ---
  const tabsBar = el('div', { class: 'tabs' });
  const lineItemsTabBtn = el('button', { class: `tab${tab === 'lineItems' ? ' active' : ''}` }, 'Line Items');
  lineItemsTabBtn.onclick = () => { state.tab = 'lineItems'; render(); };
  const printTabBtn = el('button', { class: `tab${tab === 'print' ? ' active' : ''}` }, 'Print Selections');
  printTabBtn.onclick = () => { state.tab = 'print'; render(); };
  tabsBar.append(lineItemsTabBtn, printTabBtn);
  app.appendChild(tabsBar);

  if (tab === 'print') await renderPrintSelectionsTab(version);
  else await renderLineItemsTab(version);
}

// Column widths for the Line Items grid persist across every quote the user
// opens, until they drag a column again (confirmed 2026-09-19) — one global
// setting in localStorage, not per-quote.
const LINE_ITEM_COLS = [
  { key: 'num', label: '#', default: 50 },
  { key: 'qty', label: 'Qty', default: 60 },
  { key: 'fixture', label: 'Fixture Type', default: 220 },
  { key: 'mfr', label: 'Manufacturer', default: 160 },
  { key: 'part', label: 'Part #', default: 110 },
  { key: 'dn', label: 'DN', default: 90 },
  { key: 'dnExt', label: 'DN Extended', default: 110 },
];
function loadColWidths() {
  try { return JSON.parse(localStorage.getItem('xclr8-lineitem-col-widths') || '{}'); } catch { return {}; }
}
function saveColWidths(widths) {
  try { localStorage.setItem('xclr8-lineitem-col-widths', JSON.stringify(widths)); } catch {}
}
let lineItemClipboard = null; // { lineItem, children } from the Copy button — session-only, not persisted

async function renderLineItemsTab(version) {
  const [lineItems, mfrs] = await Promise.all([api(`/versions/${version.id}/line-items`), api('/manufacturers')]);
  const panel = el('div', { class: 'panel' });
  const commissionBtn = el('button', { class: 'secondary' }, 'Commission Structure');
  commissionBtn.onclick = () => openCommissionStructureDialog(version, panel);
  panel.appendChild(el('div', { class: 'panel-header' }, [el('h2', {}, 'Line items'), commissionBtn]));

  const sorted = [...lineItems].sort((a, b) => a.lineNumber - b.lineNumber);
  const mfrById = new Map(mfrs.map(m => [m.id, m]));
  const widths = loadColWidths();

  const reload = () => render();

  // Every action below surfaces a failure with alert() instead of letting a
  // rejected promise vanish silently — previously a failed request (a
  // stale reference, a validation error) just looked like the button did
  // nothing (2026-09-19 fix).
  const deleteLine = async (id) => {
    try {
      await api(`/line-items/${id}?editedBy=${encodeURIComponent(getUserName())}`, { method: 'DELETE' });
      reload();
    } catch (e) { alert(`Couldn't delete this line: ${e.message}`); }
  };
  // Inserts a new line directly above the given row, of whichever type is
  // asked for — the per-row "+" menu (any of the 5 types) and the
  // Ctrl+Shift+= hotkey (defaults to 'item', the common case) both call
  // this. New rows land with placeholder defaults and are filled out
  // inline in the grid, same as "+ Add ..." below the table (2026-09-19).
  const insertLineAbove = async (id, lineType = 'item') => {
    try {
      const body = { lineType, editedBy: getUserName() };
      if (lineType === 'item') {
        Object.assign(body, { quantity: '1', fixtureType: '', manufacturerId: mfrs[0].id, dnBase: '0' });
      } else if (lineType === 'note' || lineType === 'description') {
        Object.assign(body, { noteText: '', internalOnly: false });
      }
      await api(`/line-items/${id}/insert-before`, { method: 'POST', body });
      reload();
    } catch (e) { alert(`Couldn't insert a line: ${e.message}`); }
  };
  // Copy works on Item, Note, and Description lines — an Item's copy also
  // carries its positional Note/Description children (2026-09-19).
  const copyLine = async (id) => {
    try {
      lineItemClipboard = await api(`/line-items/${id}/with-children`);
      reload();
    } catch (e) { alert(`Couldn't copy this line: ${e.message}`); }
  };
  const pasteLine = async () => {
    if (!lineItemClipboard) return;
    try {
      const src = lineItemClipboard.lineItem;
      if (src.lineType === 'note' || src.lineType === 'description') {
        await api(`/versions/${version.id}/line-items`, {
          method: 'POST',
          body: { lineType: src.lineType, noteText: src.noteText || '', internalOnly: !!src.internalOnly, editedBy: getUserName() },
        });
      } else {
        await api(`/versions/${version.id}/line-items`, {
          method: 'POST',
          body: {
            lineType: 'item',
            quantity: src.quantity,
            fixtureType: src.fixtureType,
            manufacturerId: src.manufacturerId,
            partNumber: src.partNumber || undefined,
            partDescription: src.partDescription || undefined,
            dnBase: src.dnBase,
            editedBy: getUserName(),
          },
        });
        // Notes/descriptions land right after the new item, in the same
        // order — since a parent is positional (the run of note/description
        // rows right below an item), this keeps them tied to it (2026-09-19).
        for (const child of lineItemClipboard.children) {
          await api(`/versions/${version.id}/line-items`, {
            method: 'POST',
            body: {
              lineType: child.lineType,
              noteText: child.noteText || undefined,
              internalOnly: child.internalOnly,
              editedBy: getUserName(),
            },
          });
        }
      }
      reload();
    } catch (e) { alert(`Couldn't paste: ${e.message}`); }
  };

  if (!sorted.length) {
    panel.appendChild(el('div', { class: 'empty' }, 'No line items yet — add one below.'));
  } else {
    const colgroup = el('colgroup', {}, [
      el('col', { style: 'width:34px;' }), // trash
      el('col', { style: 'width:40px;' }), // insert (+)
      el('col', { style: 'width:34px;' }), // copy
      ...LINE_ITEM_COLS.map(c => el('col', { style: `width:${widths[c.key] || c.default}px;` })),
    ]);
    const table = el('table', { style: 'table-layout:fixed;' });
    table.appendChild(colgroup);

    const headerRow = el('tr', {}, [el('th', {}, ''), el('th', {}, ''), el('th', {}, '')]);
    LINE_ITEM_COLS.forEach((c, i) => {
      const th = el('th', { style: 'position:relative;' }, c.label);
      const handle = el('div', {
        style: 'position:absolute; right:0; top:0; bottom:0; width:6px; cursor:col-resize; user-select:none;',
      });
      handle.onmousedown = (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const col = colgroup.children[i + 3];
        const startWidth = col.getBoundingClientRect().width;
        const onMove = (me) => {
          const w = Math.max(40, startWidth + (me.clientX - startX));
          col.style.width = w + 'px';
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          const current = loadColWidths();
          current[c.key] = parseInt(col.style.width, 10);
          saveColWidths(current);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };
      th.appendChild(handle);
      headerRow.appendChild(th);
    });
    table.appendChild(headerRow);

    // Running sum for Subtotal rows: item lines' DN Extended since the
    // previous Subtotal (or the start), computed live so an edit above
    // always keeps a Subtotal correct (2026-09-19).
    let runningDnExt = 0;

    sorted.forEach(li => {
      const trashBtn = el('button', { class: 'secondary', title: 'Delete this line' }, '🗑');
      trashBtn.onclick = () => deleteLine(li.id);
      // "+" is a type picker, not a plain button — inserting above needs to
      // say what kind of line it is (item/note/description/blank/subtotal),
      // same 5 options as the "+ Add ..." bar below the table (2026-09-19).
      const insertSelect = el(
        'select',
        { class: 'secondary', title: 'Insert a line above this one (Ctrl+Shift+= inserts an item line)', style: 'width:100%;' },
        [
          el('option', { value: '' }, '+'),
          el('option', { value: 'item' }, 'Item'),
          el('option', { value: 'note' }, 'Note'),
          el('option', { value: 'description' }, 'Description'),
          el('option', { value: 'blank' }, 'Blank'),
          el('option', { value: 'subtotal' }, 'Subtotal'),
        ],
      );
      insertSelect.onchange = () => {
        const chosen = insertSelect.value;
        if (chosen) insertLineAbove(li.id, chosen);
      };
      const actionCells = [el('td', {}, trashBtn), el('td', {}, insertSelect)];

      // Item, Note, and Description lines are all copyable — Blank and
      // Subtotal aren't (there's nothing to carry over) (2026-09-19).
      if (li.lineType === 'item' || li.lineType === 'note' || li.lineType === 'description') {
        const copyBtn = el('button', { class: 'secondary', title: 'Copy this line' }, '⎘');
        copyBtn.onclick = () => copyLine(li.id);
        actionCells.push(el('td', {}, copyBtn));
      } else {
        actionCells.push(el('td', {}));
      }

      if (li.lineType === 'blank') {
        const row = el('tr', {}, actionCells);
        row.dataset.lineId = li.id;
        row.append(el('td', {}, ''), el('td', { colspan: String(LINE_ITEM_COLS.length - 1) }, ''));
        table.appendChild(row);
        return;
      }

      if (li.lineType === 'subtotal') {
        const amount = runningDnExt;
        runningDnExt = 0;
        const row = el('tr', { style: 'font-weight:700;' }, actionCells);
        row.dataset.lineId = li.id;
        // The title is freeform (reuses noteText, unused by blank/subtotal
        // rows otherwise) but defaults to "Subtotal" until renamed
        // (confirmed 2026-09-19).
        const labelInput = el('input', {
          value: li.noteText || 'Subtotal',
          style: 'width:100%; border:none; background:transparent; font-weight:700;',
        });
        labelInput.onchange = async () => {
          try {
            await api(`/line-items/${li.id}`, { method: 'PATCH', body: { noteText: labelInput.value, editedBy: getUserName() } });
          } catch (e) { alert(`Couldn't save that change: ${e.message}`); }
        };
        row.append(
          el('td', {}, ''),
          el('td', { colspan: String(LINE_ITEM_COLS.length - 2) }, labelInput),
          el('td', { class: 'num' }, `$${amount.toFixed(2)}`),
        );
        table.appendChild(row);
        return;
      }

      if (li.lineType === 'note' || li.lineType === 'description') {
        const isNote = li.lineType === 'note';
        // Grey for a normal printable note, light red for internal-only;
        // descriptions are never shaded (confirmed 2026-09-19).
        const bg = isNote ? (li.internalOnly ? '#fbe4e2' : '#eef0f3') : '';
        const row = el('tr', bg ? { style: `background:${bg};` } : {});
        row.dataset.lineId = li.id;
        actionCells.forEach(c => row.appendChild(c));
        const textInput = el('input', { value: li.noteText || '', style: 'width:100%; border:none; background:transparent;' });
        textInput.onchange = async () => {
          try {
            await api(`/line-items/${li.id}`, { method: 'PATCH', body: { noteText: textInput.value, editedBy: getUserName() } });
          } catch (e) { alert(`Couldn't save that change: ${e.message}`); }
        };
        const cellChildren = [textInput];
        if (isNote) {
          const internalCheckbox = el('input', { type: 'checkbox' });
          internalCheckbox.checked = !!li.internalOnly;
          internalCheckbox.onchange = async () => {
            try {
              await api(`/line-items/${li.id}`, { method: 'PATCH', body: { internalOnly: internalCheckbox.checked, editedBy: getUserName() } });
              reload();
            } catch (e) { alert(`Couldn't save that change: ${e.message}`); }
          };
          cellChildren.push(el('label', { style: 'flex-direction:row; align-items:center; gap:4px; display:inline-flex; margin-left:10px;' }, [internalCheckbox, 'Internal only']));
        }
        // Merged cell starts in line with the Fixture Type column — # and
        // Qty stay separate/blank so the text always begins under Fixture
        // Type regardless of column widths (confirmed 2026-09-19).
        row.append(
          el('td', {}, isNote ? 'NTE' : 'DES'),
          el('td', {}, ''),
          el('td', { colspan: String(LINE_ITEM_COLS.length - 2) }, cellChildren),
        );
        table.appendChild(row);
        return;
      }

      // lineType === 'item' — every cell is freely editable inline, no need
      // to open the line item's own page first (confirmed 2026-09-19).
      const qtyInput = el('input', { value: li.quantity, style: 'width:100%; border:none; background:transparent;' });
      const fixtureInput = el('input', { value: li.fixtureType || '', style: 'width:100%; border:none; background:transparent;' });
      const mfrSelect = el('select', { style: 'width:100%; border:none; background:transparent;' }, mfrs.map(m => el('option', { value: m.id, selected: m.id === li.manufacturerId ? 'true' : undefined }, m.name)));
      const partInput = el('input', { value: li.partNumber || '', style: 'width:100%; border:none; background:transparent;' });
      const dnInput = el('input', { value: li.dnBase, style: 'width:100%; border:none; background:transparent; text-align:right;' });

      const patch = async (fields) => {
        try {
          await api(`/line-items/${li.id}`, { method: 'PATCH', body: { ...fields, editedBy: getUserName() } });
        } catch (e) { alert(`Couldn't save that change: ${e.message}`); }
      };
      qtyInput.onchange = () => { patch({ quantity: qtyInput.value }); dnExtCell.textContent = `$${(Number(qtyInput.value) * Number(dnInput.value)).toFixed(2)}`; };
      fixtureInput.onchange = () => patch({ fixtureType: fixtureInput.value });
      mfrSelect.onchange = () => patch({ manufacturerId: mfrSelect.value }).then(reload);
      partInput.onchange = () => patch({ partNumber: partInput.value });
      dnInput.onchange = () => { patch({ dnBase: dnInput.value }); dnExtCell.textContent = `$${(Number(qtyInput.value) * Number(dnInput.value)).toFixed(2)}`; };

      const dnExtended = Number(li.quantity) * Number(li.dnBase);
      runningDnExt += dnExtended;
      const dnExtCell = el('td', { class: 'num' }, `$${dnExtended.toFixed(2)}`);

      const row = el('tr', {}, actionCells);
      row.dataset.lineId = li.id;
      row.append(
        el('td', {}, String(li.lineNumber)),
        el('td', {}, qtyInput),
        el('td', {}, fixtureInput),
        el('td', {}, mfrSelect),
        el('td', {}, partInput),
        el('td', {}, dnInput),
        dnExtCell,
      );
      table.appendChild(row);
    });
    // Excel's "insert row above" hotkey, scoped to this grid: works while
    // focused in any field of a row, inserting a blank line above that row
    // (2026-09-19).
    table.addEventListener('keydown', (e) => {
      const isPlus = e.key === '+' || e.key === '=';
      if (!isPlus || !e.shiftKey || !(e.ctrlKey || e.metaKey)) return;
      const row = e.target.closest('tr[data-line-id]');
      if (!row) return;
      e.preventDefault();
      insertLineAbove(row.dataset.lineId);
    });
    panel.appendChild(table);
  }

  const addBar = el('div', { style: 'display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;' });
  if (!mfrs.length) {
    panel.appendChild(el('div', { class: 'muted', style: 'margin-top:14px;' }, 'Add a manufacturer from the Manufacturers page first.'));
  } else {
    const addLineBtn = el('button', {}, '+ Add line item');
    const addNoteBtn = el('button', { class: 'secondary' }, '+ Add note');
    const addDescBtn = el('button', { class: 'secondary' }, '+ Add description');
    const addBlankBtn = el('button', { class: 'secondary' }, '+ Add blank');
    const addSubtotalBtn = el('button', { class: 'secondary' }, '+ Add subtotal');
    addBar.append(addLineBtn, addNoteBtn, addDescBtn, addBlankBtn, addSubtotalBtn);
    if (lineItemClipboard) {
      const clip = lineItemClipboard.lineItem;
      const clipLabel = clip.lineType === 'item' ? (clip.fixtureType || 'line') : (clip.noteText || clip.lineType);
      const pasteBtn = el('button', { class: 'secondary' }, `Paste "${clipLabel}"`);
      pasteBtn.onclick = pasteLine;
      addBar.appendChild(pasteBtn);
    }
    panel.appendChild(addBar);

    // "+ Add line item" drops a new row straight into the grid, filled out
    // inline like every other row — no separate form to fill in first
    // (confirmed 2026-09-19). Defaults to the first manufacturer in the
    // list; the user can change it right there in the row.
    addLineBtn.onclick = async () => {
      try {
        await api(`/versions/${version.id}/line-items`, {
          method: 'POST',
          body: { lineType: 'item', quantity: '1', fixtureType: '', manufacturerId: mfrs[0].id, dnBase: '0', editedBy: getUserName() },
        });
        reload();
      } catch (e) { alert(`Couldn't add a line item: ${e.message}`); }
    };
    addNoteBtn.onclick = async () => {
      try {
        await api(`/versions/${version.id}/line-items`, {
          method: 'POST',
          body: { lineType: 'note', noteText: '', internalOnly: false, editedBy: getUserName() },
        });
        reload();
      } catch (e) { alert(`Couldn't add a note: ${e.message}`); }
    };
    addDescBtn.onclick = async () => {
      try {
        await api(`/versions/${version.id}/line-items`, {
          method: 'POST',
          body: { lineType: 'description', noteText: '', internalOnly: false, editedBy: getUserName() },
        });
        reload();
      } catch (e) { alert(`Couldn't add a description: ${e.message}`); }
    };
    addBlankBtn.onclick = async () => {
      try {
        await api(`/versions/${version.id}/line-items`, { method: 'POST', body: { lineType: 'blank', editedBy: getUserName() } });
        reload();
      } catch (e) { alert(`Couldn't add a blank line: ${e.message}`); }
    };
    addSubtotalBtn.onclick = async () => {
      try {
        await api(`/versions/${version.id}/line-items`, { method: 'POST', body: { lineType: 'subtotal', editedBy: getUserName() } });
        reload();
      } catch (e) { alert(`Couldn't add a subtotal: ${e.message}`); }
    };
  }
  app.appendChild(panel);
}

/**
 * "Commission Structure" — lists every manufacturer actually used on this
 * quote version, with its currently effective commission/overage (an
 * override here, or the manufacturer's standard rate), editable per
 * manufacturer for this quote only (confirmed 2026-09-19).
 */
async function openCommissionStructureDialog(version, panel) {
  const existing = panel.querySelector('.commission-dialog');
  if (existing) { existing.remove(); return; }

  const rows = await api(`/versions/${version.id}/commission-structure`);
  const wrap = el('div', { class: 'dialog commission-dialog' });
  wrap.appendChild(el('div', { class: 'dialog-title' }, 'Commission Structure for this quote'));
  if (!rows.length) {
    wrap.appendChild(el('div', { class: 'muted' }, 'No manufacturers on this quote yet — add a line item first.'));
  } else {
    const table = el('table');
    table.appendChild(el('tr', {}, [el('th', {}, 'Manufacturer'), el('th', {}, 'Commission %'), el('th', {}, 'Overage %'), el('th', {}, '')]));
    rows.forEach(r => {
      const commissionInput = el('input', { value: r.commissionPct, style: 'width:80px;' });
      const overageInput = el('input', { value: r.overageSplitPct, style: 'width:80px;' });
      const saveBtn = el('button', { class: 'secondary' }, 'Save');
      saveBtn.onclick = async () => {
        await api(`/versions/${version.id}/commission-structure`, {
          method: 'POST',
          body: {
            manufacturerId: r.manufacturerId,
            commissionPct: commissionInput.value,
            overageSplitPct: overageInput.value,
            editedBy: getUserName(),
          },
        });
        render();
      };
      table.appendChild(el('tr', {}, [
        el('td', {}, r.manufacturerName + (r.isOverridden ? ' (overridden)' : '')),
        el('td', {}, commissionInput),
        el('td', {}, overageInput),
        el('td', {}, saveBtn),
      ]));
    });
    wrap.appendChild(table);
  }
  panel.appendChild(wrap);
}

async function renderPrintSelectionsTab(version) {
  const [selections, customers] = await Promise.all([
    api(`/versions/${version.id}/print-selections`),
    api('/customers'),
  ]);
  const panel = el('div', { class: 'panel' });
  panel.appendChild(el('div', { class: 'panel-header' }, [
    el('h2', {}, 'Print selections'),
    el('span', { class: 'sub' }),
  ]));
  panel.appendChild(el('div', { class: 'muted' }, 'Which price column each customer or group sees when their quote is printed/sent.'));
  if (!selections.length) panel.appendChild(el('div', { class: 'empty' }, 'No selections set yet.'));
  else {
    const table = el('table');
    table.appendChild(el('tr', {}, [el('th', {}, 'Customer'), el('th', {}, 'Type'), el('th', {}, 'Column'), el('th', {}, '')]));
    selections.forEach(s => {
      const viewBtn = el('button', { class: 'secondary' }, 'View quote');
      viewBtn.onclick = () => showPrintableQuote(version.id, s.customerId);
      table.appendChild(el('tr', {}, [
        el('td', {}, s.customerName),
        el('td', {}, el('span', { class: `badge ${s.customerType}` }, s.customerType)),
        el('td', {}, `#${s.selectedColumnOrder}`),
        el('td', {}, viewBtn),
      ]));
    });
    panel.appendChild(table);
  }
  if (!customers.length) {
    panel.appendChild(el('div', { class: 'muted' }, 'Add a customer from the Customers page first.'));
  } else {
    const form = el('form', { class: 'inline' });
    const custSelect = el('select', { name: 'customerId' }, customers.map(c => el('option', { value: c.id }, `${c.name} (${c.type})`)));
    form.append(
      el('label', {}, ['Customer / group', custSelect]),
      el('label', {}, ['Column # (1-10)', el('input', { name: 'selectedColumnOrder', type: 'number', min: '1', max: '10', value: '1' })]),
      el('button', {}, 'Set selection'),
    );
    form.onsubmit = async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(form).entries());
      body.selectedColumnOrder = Number(body.selectedColumnOrder);
      body.editedBy = getUserName();
      await api(`/versions/${version.id}/print-selections`, { method: 'POST', body });
      render();
    };
    panel.appendChild(form);
  }
  app.appendChild(panel);
  app.appendChild(el('div', { id: 'quote-preview' }));
}

async function showPrintableQuote(versionId, customerId) {
  const container = document.getElementById('quote-preview');
  container.innerHTML = '';
  try {
    const q = await api(`/versions/${versionId}/print-selections/${customerId}/quote`);
    const panel = el('div', { class: 'panel' });
    panel.appendChild(el('div', { class: 'panel-header' }, el('h2', {}, 'Printable quote preview')));
    const sheet = el('div', { class: 'quote-sheet' });
    sheet.appendChild(el('h3', {}, `Column #${q.selectedColumnOrder} pricing`));
    sheet.appendChild(el('div', { class: 'muted' }, `${q.recipients.length} addressed cop${q.recipients.length === 1 ? 'y' : 'ies'} would be generated:`));
    sheet.appendChild(el('ul', {}, q.recipients.map(r => el('li', {}, r.name))));
    const table = el('table');
    table.appendChild(el('tr', {}, [el('th', {}, '#'), el('th', {}, 'Fixture'), el('th', {}, 'Part #'), el('th', {}, 'Qty'), el('th', {}, 'Unit'), el('th', {}, 'Extended')]));
    q.lineItems.forEach(li => {
      if (li.lineType === 'note' || li.lineType === 'description') {
        table.appendChild(el('tr', {}, [el('td', {}, ''), el('td', { colspan: '5' }, li.noteText || '')]));
        return;
      }
      if (li.lineType === 'blank') {
        table.appendChild(el('tr', {}, [el('td', {}, ''), el('td', { colspan: '5' }, '')]));
        return;
      }
      if (li.lineType === 'subtotal') {
        table.appendChild(el('tr', { style: 'font-weight:700;' }, [el('td', {}, ''), el('td', { colspan: '4' }, li.noteText || 'Subtotal'), el('td', { class: 'num' }, `$${li.extendedSellPrice}`)]));
        return;
      }
      table.appendChild(el('tr', {}, [
        el('td', {}, String(li.lineNumber)), el('td', {}, li.fixtureType), el('td', {}, li.partNumber || '—'),
        el('td', { class: 'num' }, li.quantity), el('td', { class: 'num' }, `$${li.unitSellPrice}`), el('td', { class: 'num' }, `$${li.extendedSellPrice}`),
      ]));
    });
    sheet.appendChild(table);
    sheet.appendChild(el('div', { class: 'total' }, `Total: $${q.quoteTotal}`));
    panel.appendChild(sheet);
    container.appendChild(panel);
  } catch (e) {
    container.appendChild(el('div', { class: 'panel' }, el('div', { class: 'error' }, String(e.message || e))));
  }
}

async function renderLineItem() {
  const li = await api(`/line-items/${state.lineItemId}`);
  const quote = await api(`/quotes/${state.quoteId}`);
  const job = await api(`/jobs/${quote.jobId}`);
  app.appendChild(crumbs([
    { label: 'Jobs', onClick: () => goto('jobs') },
    { label: job.name, onClick: () => goto('job', { jobId: job.id }) },
    { label: quote.bidPackage, onClick: () => goto('quote', { quoteId: quote.id }) },
    { label: 'version', onClick: () => goto('version', { versionId: state.versionId, quoteId: state.quoteId }) },
    { label: `#${li.lineNumber} ${li.fixtureType}` },
  ]));
  const panel = el('div', { class: 'panel' });
  const addColBtn = el('button', { class: 'secondary' }, '+ Add price column');
  panel.appendChild(el('div', { class: 'panel-header' }, [el('h2', {}, `${li.fixtureType} × ${li.quantity}`), addColBtn]));

  const table = el('table');
  table.appendChild(el('tr', {}, [el('th', {}, '#'), el('th', {}, 'Label'), el('th', {}, 'Multiplier'), el('th', {}, 'Sell Price'), el('th', {}, 'Extended'), el('th', {}, 'Commission')]));
  // DN is always the first row, automatically — the manufacturer's dealer
  // net cost, not one of the up-to-10 markup columns (confirmed 2026-09-19).
  table.appendChild(el('tr', {}, [
    el('td', {}, '—'), el('td', {}, el('span', { class: 'badge draft' }, 'DN')), el('td', { class: 'num' }, '1.00×'),
    el('td', { class: 'num' }, `$${li.dnBase}`), el('td', { class: 'num' }, `$${(Number(li.dnBase) * Number(li.quantity)).toFixed(2)}`), el('td', { class: 'num' }, '—'),
  ]));
  li.priceColumns.forEach(pc => table.appendChild(el('tr', {}, [
    el('td', {}, String(pc.columnOrder)), el('td', {}, pc.columnLabel), el('td', { class: 'num' }, `${pc.multiplier}×`),
    el('td', { class: 'num' }, `$${pc.computedSellPrice}`), el('td', { class: 'num' }, `$${pc.extendedSellPrice}`), el('td', { class: 'num' }, `$${pc.commissionEarnedAtThisColumn}`),
  ])));
  panel.appendChild(table);

  const formHost = el('div');
  panel.appendChild(formHost);
  addColBtn.onclick = () => {
    if (formHost.childElementCount) { formHost.innerHTML = ''; return; }
    const wrap = el('div', { class: 'dialog' });
    const labelInput = el('input', { placeholder: 'Contractor' });
    const multiplierInput = el('input', { placeholder: '1.15' });
    const orderInput = el('input', { type: 'number', min: '1', max: '10', value: String(li.priceColumns.length + 1) });
    wrap.appendChild(el('div', { class: 'dialog-title' }, 'Add price column'));
    wrap.append(
      el('div', { style: 'display:flex; flex-wrap:wrap; gap:10px;' }, [
        el('label', {}, ['Column label', labelInput]),
        el('label', {}, ['Multiplier', multiplierInput]),
        el('label', {}, ['Column # (1-10)', orderInput]),
      ]),
    );
    const actions = el('div', { class: 'dialog-actions' });
    const saveBtn = el('button', {}, 'Add price column');
    const cancelBtn = el('button', { class: 'secondary' }, 'Cancel');
    cancelBtn.type = 'button';
    cancelBtn.onclick = () => { formHost.innerHTML = ''; };
    actions.append(saveBtn, cancelBtn);
    wrap.appendChild(actions);
    saveBtn.onclick = async () => {
      if (!labelInput.value || !multiplierInput.value) return;
      await api(`/line-items/${li.id}/price-columns`, {
        method: 'POST',
        body: {
          columnLabel: labelInput.value,
          multiplier: multiplierInput.value,
          columnOrder: Number(orderInput.value),
          editedBy: getUserName(),
        },
      });
      render();
    };
    formHost.appendChild(wrap);
  };
  app.appendChild(panel);
}

// ================= CUSTOMERS =================
async function renderCustomers() {
  app.appendChild(crumbs([{ label: 'Customers' }]));
  const customers = await api('/customers');
  const panel = el('div', { class: 'panel' });
  panel.appendChild(el('div', { class: 'panel-header' }, el('h2', {}, `Customers (${customers.length})`)));
  if (!customers.length) panel.appendChild(el('div', { class: 'empty' }, 'No customers yet — add one below.'));
  else {
    const table = el('table');
    table.appendChild(el('tr', {}, [el('th', {}, 'Name'), el('th', {}, 'Type')]));
    customers.forEach(c => table.appendChild(el('tr', { class: 'clickable', onclick: () => goto('customer', { customerId: c.id }) }, [
      el('td', {}, c.name), el('td', {}, el('span', { class: `badge ${c.type}` }, c.type)),
    ])));
    panel.appendChild(table);
  }
  const form = el('form', { class: 'inline' });
  form.append(
    el('label', {}, ['Name', el('input', { name: 'name', required: 'true' })]),
    el('label', {}, ['Type', el('select', { name: 'type' }, [el('option', { value: 'individual' }, 'Individual'), el('option', { value: 'group' }, 'Group')])]),
    el('button', {}, 'Add customer'),
  );
  form.onsubmit = async (e) => {
    e.preventDefault();
    await api('/customers', { method: 'POST', body: Object.fromEntries(new FormData(form).entries()) });
    render();
  };
  panel.appendChild(form);
  app.appendChild(panel);
}

async function renderCustomerDetail() {
  const customer = await api(`/customers/${state.customerId}`);
  app.appendChild(crumbs([
    { label: 'Customers', onClick: () => goto('customers') },
    { label: customer.name },
  ]));
  const panel = el('div', { class: 'panel' });
  panel.appendChild(el('div', { class: 'panel-header' }, [
    el('h2', {}, customer.name),
    el('span', { class: `badge ${customer.type}` }, customer.type),
  ]));
  if (customer.type === 'group') {
    if (!customer.members.length) panel.appendChild(el('div', { class: 'empty' }, 'No members yet — add one below.'));
    else {
      const table = el('table');
      table.appendChild(el('tr', {}, el('th', {}, 'Member')));
      customer.members.forEach(m => table.appendChild(el('tr', {}, el('td', {}, m.name))));
      panel.appendChild(table);
    }
    const allCustomers = (await api('/customers')).filter(c => c.type === 'individual' && c.id !== customer.id);
    if (allCustomers.length) {
      const form = el('form', { class: 'inline' });
      const select = el('select', { name: 'memberCustomerId' }, allCustomers.map(c => el('option', { value: c.id }, c.name)));
      form.append(el('label', {}, ['Add member', select]), el('button', {}, 'Add to group'));
      form.onsubmit = async (e) => {
        e.preventDefault();
        await api(`/customers/${customer.id}/members`, { method: 'POST', body: Object.fromEntries(new FormData(form).entries()) });
        render();
      };
      panel.appendChild(form);
    }
  } else {
    panel.appendChild(el('div', { class: 'muted' }, 'Individual customer — used directly in Print Selections on a quote version.'));
  }
  app.appendChild(panel);
}

// ================= MANUFACTURERS =================
async function renderManufacturersPage() {
  app.appendChild(crumbs([{ label: 'Manufacturers' }]));
  const mfrs = await api('/manufacturers');
  const panel = el('div', { class: 'panel' });
  panel.appendChild(el('div', { class: 'panel-header' }, el('h2', {}, `Manufacturers (${mfrs.length})`)));
  if (mfrs.length) {
    const table = el('table');
    table.appendChild(el('tr', {}, [el('th', {}, 'Name'), el('th', {}, 'Std. Commission %'), el('th', {}, 'Std. Overage %'), el('th', {}, '')]));
    mfrs.forEach(m => {
      const commissionInput = el('input', { value: m.standardCommissionPct, style: 'width:80px;' });
      const overageInput = el('input', { value: m.standardOverageSplitPct, style: 'width:80px;' });
      const saveBtn = el('button', { class: 'secondary' }, 'Save');
      saveBtn.onclick = async () => {
        await api(`/manufacturers/${m.id}`, {
          method: 'PATCH',
          body: { standardCommissionPct: commissionInput.value, standardOverageSplitPct: overageInput.value },
        });
        render();
      };
      table.appendChild(el('tr', {}, [
        el('td', {}, m.name),
        el('td', { class: 'num' }, commissionInput),
        el('td', { class: 'num' }, overageInput),
        el('td', {}, saveBtn),
      ]));
    });
    panel.appendChild(table);
    panel.appendChild(el('div', { class: 'muted' }, "These standard rates auto-populate new line items for that manufacturer. Changing them here doesn't touch quotes already created — use a quote's Commission Structure button to adjust an existing quote."));
  } else {
    panel.appendChild(el('div', { class: 'empty' }, 'No manufacturers yet — add one below.'));
  }
  const form = el('form', { class: 'inline' });
  form.append(
    el('label', {}, ['Manufacturer', el('input', { name: 'name', required: 'true' })]),
    el('label', {}, ['Commission % (0-1)', el('input', { name: 'standardCommissionPct', placeholder: '0.10' })]),
    el('label', {}, ['Overage % (0-1)', el('input', { name: 'standardOverageSplitPct', placeholder: '0.15' })]),
    el('button', {}, 'Add manufacturer'),
  );
  form.onsubmit = async (e) => {
    e.preventDefault();
    await api('/manufacturers', { method: 'POST', body: Object.fromEntries(new FormData(form).entries()) });
    render();
  };
  panel.appendChild(form);
  app.appendChild(panel);
}

render();
</script>
</body>
</html>
